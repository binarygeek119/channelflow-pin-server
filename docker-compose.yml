services:
  pinserver:
    build: .
    container_name: channelflow-pin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CERT_DIR: /var/lib/channelflow-pin/certs
    ports:
      - "80:80"
      - "443:443"
      - "43123:43123"
    volumes:
      - pin-certs:/var/lib/channelflow-pin/certs

volumes:
  pin-certs:
